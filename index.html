<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan Kapal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Style untuk Preloader Profesional */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        .loading-text {
            color: #4a5568;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Sembunyikan iframe saat awal loading */
        #app-content {
            width: 100%;
            height: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Animasi Loading dengan Teks Profesional -->
    <div id="preloader">
        <div class="spinner"></div>
        <div class="loading-text">Memuat Sistem Laporan... Please Wait</div>
    </div>

    <!-- Konten Utama (Iframe Google Apps Script) -->
    <div id="app-content">
        <iframe src="https://script.google.com/macros/s/AKfycbwbe8kL93BbnK6YjrXgiW_bdaxasFwTJchuA2bPCaMsfGZJX9Y9sv5NQmAfUWGfWiyf/exec"></iframe>
    </div>

    <script>
        // Mengatur timer loading fiktif selama 7 detik (7000 milidetik)
        window.addEventListener('load', function() {
            setTimeout(function() {
                const preloader = document.getElementById('preloader');
                const appContent = document.getElementById('app-content');
                
                // Efek pudar pelan pada preloader
                preloader.style.opacity = '0';
                
                setTimeout(function() {
                    preloader.style.display = 'none';
                    appContent.style.display = 'block';
                }, 500); // Waktu transisi pudar
                
            }, 4000); // Durasi 7 detik
        });
    </script>

</body>
</html>
