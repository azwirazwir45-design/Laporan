<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan Kapal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Style untuk Animasi Loading / Preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Sembunyikan iframe saat awal loading */
        #app-content {
            width: 100%;
            height: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Animasi Loading Putar -->
    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <!-- Konten Utama (Iframe Google Apps Script) -->
    <div id="app-content">
        <iframe id="gas-frame" src="https://script.google.com/macros/s/AKfycbwbe8kL93BbnK6YjrXgiW_bdaxasFwTJchuA2bPCaMsfGZJX9Y9sv5NQmAfUWGfWiyf/exec"></iframe>
    </div>

    <script>
        // Menghilangkan preloader begitu iframe selesai dimuat
        const iframe = document.getElementById('gas-frame');
        iframe.addEventListener('load', function() {
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        });
    </script>

</body>
</html>
