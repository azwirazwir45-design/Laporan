<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan Kapal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Style Preloader Utama */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .brand-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .loading-text {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.8px;
            margin-bottom: 25px;
        }
        .spinner-container {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 25px;
        }
        .spinner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(56, 189, 248, 0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        .progress-track {
            width: 220px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 4px;
            animation: progressAnimation 7s linear forwards;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes progressAnimation {
            0% { width: 0%; }
            50% { width: 75%; }
            100% { width: 100%; }
        }
        /* Konten utama */
        #app-content {
            width: 100%;
            height: 100%;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <div class="brand-title" id="preloader-title">Sistem Laporan Kapal</div>
        <div class="loading-text" id="preloader-text">Memuat Data Operasional... Please Wait</div>
        
        <div class="spinner-container" id="spinner-box">
            <div class="spinner"></div>
        </div>

        <div class="progress-track" id="progress-box">
            <div class="progress-fill"></div>
        </div>
    </div>

    <!-- Konten Utama (Iframe Google Apps Script) -->
    <div id="app-content">
        <iframe src="https://script.google.com/macros/s/AKfycbwbe8kL93BbnK6YjrXgiW_bdaxasFwTJchuA2bPCaMsfGZJX9Y9sv5NQmAfUWGfWiyf/exec"></iframe>
    </div>

    <script>
        if (sessionStorage.getItem('sudah_muat')) {
            // Jika di-refresh: Tampilkan mode cepat "Please Wait" sebentar saja (0.8 detik)
            document.getElementById('preloader-title').style.display = 'none';
            document.getElementById('spinner-box').style.display = 'none';
            document.getElementById('progress-box').style.display = 'none';
            document.getElementById('preloader-text').innerText = 'Please Wait...';

            setTimeout(function() {
                const preloader = document.getElementById('preloader');
                const appContent = document.getElementById('app-content');
                preloader.style.opacity = '0';
                setTimeout(function() {
                    preloader.style.display = 'none';
                    appContent.style.display = 'block';
                }, 400);
            }, 800); // 0.8 detik untuk refresh

        } else {
            // Kunjungan pertama: Jalankan animasi lengkap 7 detik
            window.addEventListener('load', function() {
                setTimeout(function() {
                    const preloader = document.getElementById('preloader');
                    const appContent = document.getElementById('app-content');
                    
                    preloader.style.opacity = '0';
                    
                    setTimeout(function() {
                        preloader.style.display = 'none';
                        appContent.style.display = 'block';
                        sessionStorage.setItem('sudah_muat', 'true');
                    }, 600);
                    
                }, 7000); // 7 detik untuk kunjungan pertama
            });
        }
    </script>

</body>
</html>
